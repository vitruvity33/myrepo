# Rebuilds every folder's log (01_RECORDS/INDEX.md) and 01_READ_FIRST/04_CATALOG.md
# after each push, so the catalog lists every saved file whichever tool saved it.
name: Update catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_catalog.py
      - name: Save the catalog if it changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Update catalog"
            git pull --rebase
            git push
          fi
