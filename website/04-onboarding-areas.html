    Behavior (app.js):
    - + Folder adds a folder row in edit mode (Enter commits, Esc cancels)

      "×" deletes (with confirm). Tree persists in localStorage.
    LIVE (build.js + github.js): tree loads from the user's repo on open;
      a new folder commits {path}/AGENTS.md + README.md + 01_RECORDS/README.md

      Delete is not wired (no × yet) — removing from GitHub is deliberate work.
